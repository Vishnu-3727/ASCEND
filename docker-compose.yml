version: "3.9"

services:
  ascend:
    build: .
    image: ascend-pi5:latest
    network_mode: host          # shares Pi network — MAVROS talks to PX4 over UDP
    privileged: true            # needed for serial/USB access to flight controller
    environment:
      - ROS_DOMAIN_ID=0
      - ARENA_NAME=rect_baseline # change to hex_regular / hex_irregular / pent_irregular
    volumes:
      - /dev:/dev               # exposes serial ports (/dev/ttyUSB0, /dev/ttyAMA0)
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               ros2 run mavros mavros_node
                 --ros-args
                 -p fcu_url:=serial:///dev/ttyAMA0:921600
                 -p gcs_url:=udp://@192.168.1.100:14550"
